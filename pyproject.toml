[project]
name = "coursework-helpdesk"
version = "0.1.0"
description = "Helpdesk coursework baseline for performance measurements"
requires-python = ">=3.12,<3.13"
dependencies = [
    "litestar>=2.0,<3",
    "uvicorn>=0.30,<1",
    "dishka>=1.3,<2",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyjwt>=2.10,<3",
    "argon2-cffi>=25,<26",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "mypy>=1.10,<3",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["backend/migrations/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --strict-markers"
markers = ["integration: requires a migrated PostgreSQL 17 test database"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/migrations/*", "backend/app/main.py"]

[tool.coverage.report]
show_missing = true
