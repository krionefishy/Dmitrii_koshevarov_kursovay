name: ${PERSONAL_PREFIX:-dmitrii_koshevarov}_helpdesk_test
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: dmitrii_koshevarov_helpdesk_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
